server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: inspectorate-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/officer_db
    username: postgres
    password: vannoy
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 20
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: Asia/Phnom_Penh

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

  task:
    scheduling:
      pool:
        size: 3
      thread-name-prefix: scheduler-
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100
      thread-name-prefix: async-

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyThatIsAtLeast256BitsLong!}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:password123}
  bucket: ${MINIO_BUCKET:officer-files}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      group:
        # Render polls this path. Redis is deliberately excluded: it is a cache
        # and token blacklist, not a hard dependency (JwtAuthenticationFilter
        # fails open when it is unreachable), but including it here meant a
        # brief Redis outage stalled /actuator/health past Render's 5s health
        # check timeout and the whole service was restarted.
        readiness:
          include: db, ping, readinessState
          show-details: always

logging:
  level:
    com.project: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.springframework.cache: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"