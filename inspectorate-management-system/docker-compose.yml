version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: officer_postgres
    environment:
      POSTGRES_DB:       officer_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: vannoy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U postgres -d officer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - officer_network

  redis:
    image: redis:7-alpine
    container_name: officer_redis
    command: redis-server --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli",
             "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - officer_network

  minio:
    image: minio/minio:latest
    container_name: officer_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f",
             "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - officer_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: officer_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/officer_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: vannoy
      SPRING_DATA_REDIS_HOST:     redis
      SPRING_DATA_REDIS_PORT:     6379
      SPRING_DATA_REDIS_PASSWORD: redis123
      MINIO_URL:                  http://minio:9000
      MINIO_ACCESS_KEY:           admin
      MINIO_SECRET_KEY:           password123
      JWT_SECRET: YourSuperSecretKeyThatIsAtLeast256BitsLong!
      JWT_EXPIRATION:         86400000
      JWT_REFRESH_EXPIRATION: 604800000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - officer_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: officer_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - officer_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  officer_network:
    driver: bridge